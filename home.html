<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Home · Distill</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="css/styles.css" />
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-cream text-ink antialiased">

  <div class="flex min-h-screen">
    <div id="sidebar-root"></div>

    <div class="flex-1 min-w-0 flex flex-col">
      <header class="h-20 shrink-0 flex items-center px-6 lg:px-10 border-b border-line bg-cream/80 backdrop-blur sticky top-0 z-20">
        <div id="topnav-root" class="w-full"></div>
      </header>

      <main class="flex-1 px-6 py-10 page-enter">
        <div class="max-w-4xl mx-auto">
          
          <!-- Search & Multi-Query Controls -->
          <div class="flex items-center gap-3 mb-6">
            <div class="flex-1 search-shell flex items-center gap-3 bg-white rounded-search shadow-search border border-line h-[56px] px-4">
              <i data-lucide="search" class="w-5 h-5 text-gray-400 shrink-0"></i>
              <input id="homeSearchInput" type="text" autocomplete="off" placeholder="Search AI tools for any task..." 
                class="flex-1 min-w-0 bg-transparent outline-none text-sm placeholder:text-gray-400" />
              <button id="homeSearchBtn" class="btn-scale shrink-0 px-5 py-2 rounded-btn bg-green text-white text-sm font-semibold hover:bg-green-dark">Search</button>
            </div>
            <button id="addQueryBtn" class="btn-scale shrink-0 w-11 h-11 rounded-full bg-green-light text-green-dark flex items-center justify-center hover:bg-green hover:text-white transition-colors" title="Add additional keywords">
              <i data-lucide="plus" class="w-5 h-5"></i>
            </button>
          </div>

          <!-- Active Tags -->
          <div id="activeTags" class="flex flex-wrap gap-2 mb-6"></div>

          <!-- Results Blocks -->
          <div id="resultsBlocks">
            <!-- Empty State -->
            <div id="emptyState" class="text-center py-20">
              <i data-lucide="search-x" class="w-10 h-10 text-gray-300 mx-auto"></i>
              <p class="mt-4 text-muted">Search for a task above to see your matches.</p>
            </div>
          </div>

          <!-- Up Arrow Scroll -->
          <button id="upArrowBtn" class="fixed bottom-6 right-6 w-12 h-12 rounded-full bg-white shadow-card border border-line flex items-center justify-center opacity-0 pointer-events-none transition-opacity hover:shadow-lg">
            <i data-lucide="arrow-up" class="w-5 h-5 text-green-dark"></i>
          </button>
        </div>
      </main>

      <div id="footer-root"></div>
    </div>
  </div>

  <!-- Card Template -->
  <template id="recCardTemplate">
    <div class="rec-card flip-card bg-white rounded-card border border-line p-6 relative overflow-hidden" data-tool-id="">
      <div class="flip-card-inner">
        <!-- Front -->
        <div class="flip-card-front flex flex-col">
          <div class="flex items-start justify-between gap-3">
            <div>
              <h3 class="font-bold text-lg leading-tight tool-name"></h3>
              <p class="text-xs text-muted mt-1 tool-category"></p>
            </div>
            <span class="pricing-badge shrink-0 text-[11px] font-semibold px-2.5 py-1 rounded-full"></span>
          </div>
          <p class="text-sm text-ink/80 mt-4 leading-relaxed tool-description"></p>
          <div class="mt-4 text-xs">
            <span class="font-semibold text-green">Credits:</span> <span class="tool-credits"></span>
          </div>
          <div class="mt-2 text-xs flex items-center gap-2">
            <span class="flex items-center gap-1"><i data-lucide="star" class="w-3.5 h-3.5 fill-current text-gray-400"></i> <span class="tool-avg-rating font-semibold"></span></span>
            <span class="text-muted">(<span class="tool-rating-count"></span> users)</span>
          </div>
          <div class="mt-4 grid grid-cols-2 gap-3 text-xs flex-1">
            <div>
              <p class="font-semibold text-green-dark mb-1 flex items-center gap-1"><i data-lucide="check" class="w-3.5 h-3.5"></i>Pros</p>
              <ul class="tool-pros space-y-1 text-muted"></ul>
            </div>
            <div>
              <p class="font-semibold text-red-400 mb-1 flex items-center gap-1"><i data-lucide="x" class="w-3.5 h-3.5"></i>Cons</p>
              <ul class="tool-cons space-y-1 text-muted"></ul>
            </div>
          </div>
          <div class="mt-4 pt-3 border-t border-line flex items-center justify-between">
            <span class="flex items-center gap-1 text-xs text-gray-400">
              <i data-lucide="star" class="w-3.5 h-3.5 fill-current"></i>
              <span class="tool-rating"></span> Distill Rating
            </span>
            <a href="#" target="_blank" rel="noopener" class="tool-link btn-scale inline-flex items-center gap-1 text-xs font-semibold text-green-dark hover:underline">
              Visit site <i data-lucide="arrow-up-right" class="w-3.5 h-3.5"></i>
            </a>
          </div>
        </div>
        <!-- Back (Rating) -->
        <div class="flip-card-back">
          <p class="text-sm font-semibold mb-3">Rate this tool</p>
          <div class="star-rating flex gap-1">
            <input type="radio" id="star5" name="rating" value="5"><label for="star5">★</label>
            <input type="radio" id="star4" name="rating" value="4"><label for="star4">★</label>
            <input type="radio" id="star3" name="rating" value="3"><label for="star3">★</label>
            <input type="radio" id="star2" name="rating" value="2"><label for="star2">★</label>
            <input type="radio" id="star1" name="rating" value="1"><label for="star1">★</label>
          </div>
          <button class="submit-rating mt-4 px-5 py-1.5 rounded-btn bg-green text-white text-xs font-semibold hover:bg-green-dark">Submit</button>
        </div>
      </div>
    </div>
  </template>

  <script src="js/auth.js"></script>
  <script src="js/history.js"></script>
  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/search.js"></script>
  <script src="js/rating.js"></script>
  <script>
    requireAuth();
    renderShell("home");

    // State
    let activeQueries = [];
    let isAppending = false;

    // DOM refs
    const searchInput = document.getElementById('homeSearchInput');
    const searchBtn = document.getElementById('homeSearchBtn');
    const addBtn = document.getElementById('addQueryBtn');
    const activeTags = document.getElementById('activeTags');
    const resultsBlocks = document.getElementById('resultsBlocks');
    const emptyState = document.getElementById('emptyState');
    const upArrowBtn = document.getElementById('upArrowBtn');

    // Initial load from URL
    const urlParams = new URLSearchParams(window.location.search);
    const initialQuery = urlParams.get('q');
    if (initialQuery) {
      activeQueries = [initialQuery];
      searchInput.value = initialQuery;
      addHistory(initialQuery);
    }

    // Render tags
    function renderTags() {
      activeTags.innerHTML = activeQueries.map((q, i) => `
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-green-light text-green-dark text-xs font-semibold">
          ${q}
          <button class="remove-tag hover:text-red-500" data-index="${i}"><i data-lucide="x" class="w-3 h-3"></i></button>
        </span>
      `).join('');
      if (window.lucide) lucide.createIcons();
      
      document.querySelectorAll('.remove-tag').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.dataset.index);
          activeQueries.splice(idx, 1);
          renderTags();
          if (activeQueries.length === 0) {
            resultsBlocks.innerHTML = '';
            emptyState.classList.remove('hidden');
          } else {
            performSearch(false);
          }
        });
      });
    }

    // Dynamic description based on keywords
    function getDynamicDescription(tool, query) {
      return `Great for "${query}". ${tool.description}`;
    }

    // Fill card function
    function fillCard(node, tool, query, isBest) {
      node.dataset.toolId = tool.id;
      node.querySelector('.tool-name').textContent = tool.name;
      node.querySelector('.tool-category').textContent = tool.category;
      node.querySelector('.tool-description').textContent = getDynamicDescription(tool, query);
      node.querySelector('.tool-rating').textContent = tool.rating.toFixed(1);
      node.querySelector('.tool-link').href = tool.url;
      node.querySelector('.tool-credits').textContent = tool.credits || "Not specified";

      // Pricing
      const badge = node.querySelector('.pricing-badge');
      badge.textContent = PRICING_LABEL[tool.pricing];
      badge.className = `pricing-badge shrink-0 text-[11px] font-semibold px-2.5 py-1 rounded-full ${PRICING_CLASS[tool.pricing]}`;

      // Pros/Cons
      const prosList = node.querySelector('.tool-pros');
      prosList.innerHTML = tool.pros.slice(0, isBest ? 3 : 2).map(p => `<li class="flex gap-1"><span>·</span><span>${p}</span></li>`).join('');
      const consList = node.querySelector('.tool-cons');
      consList.innerHTML = tool.cons.slice(0, isBest ? 3 : 2).map(c => `<li class="flex gap-1"><span>·</span><span>${c}</span></li>`).join('');

      // Update Ratings
      updateCardRatings(node, tool.id);
      
      // Attach flip listener
      attachFlipListener(node);
    }

    function updateCardRatings(card, toolId) {
      const avg = getAvgRating(toolId);
      const count = getRatingCount(toolId);
      card.querySelector('.tool-avg-rating').textContent = avg ? avg.toFixed(1) : "N/A";
      card.querySelector('.tool-rating-count').textContent = count;
    }

    function attachFlipListener(card) {
      let timer = null;
      const startFlip = () => {
        timer = setTimeout(() => {
          card.classList.add('flipped');
        }, 2000);
      };
      const endFlip = () => {
        clearTimeout(timer);
      };
      card.addEventListener('mousedown', startFlip);
      card.addEventListener('mouseup', endFlip);
      card.addEventListener('mouseleave', endFlip);
      card.addEventListener('touchstart', startFlip);
      card.addEventListener('touchend', endFlip);

      // Submit rating logic
      const submitBtn = card.querySelector('.submit-rating');
      submitBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        const selected = card.querySelector('input[name="rating"]:checked');
        if (!selected) {
          alert("Please select a star rating.");
          return;
        }
        const user = currentUser();
        if (!user) {
          alert("You must be logged in to rate.");
          return;
        }
        setRating(card.dataset.toolId, user.email, parseInt(selected.value));
        card.classList.remove('flipped');
        updateCardRatings(card, card.dataset.toolId);
      });
    }

    // Main Search Function
    function performSearch(append = false) {
      if (activeQueries.length === 0) {
        resultsBlocks.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      const fullQuery = activeQueries.join(" ");
      const tools = searchTools(fullQuery, 7);

      if (!tools.length) {
        if (!append) resultsBlocks.innerHTML = '';
        return;
      }

      const block = document.createElement('div');
      block.className = 'results-block mt-8';

      const [best, ...alts] = tools;

      // Best Card
      const bestSlot = document.createElement('div');
      bestSlot.id = `best-${Date.now()}`;
      bestSlot.className = 'relative max-w-xl mx-auto';
      const bestNode = document.getElementById('recCardTemplate').content.cloneNode(true);
      const bestCardEl = bestNode.querySelector('.rec-card');
      bestCardEl.classList.add('ring-2', 'ring-amber-400', 'shadow-xl', 'scale-[1.05]', 'page-enter');
      const bestTitle = bestNode.querySelector('.tool-name');
      if (bestTitle) bestTitle.classList.add('text-2xl');
      const bestLink = bestNode.querySelector('.tool-link');
      if (bestLink) bestLink.classList.add('text-sm', 'px-3', 'py-1.5', 'bg-green', 'text-white', 'rounded-btn', 'hover:bg-green-dark', 'no-underline');
      const badge = document.createElement('span');
      badge.className = 'absolute -top-3 left-6 z-10 inline-flex items-center gap-1 text-[11px] font-bold px-3 py-1 rounded-full bg-amber-400 text-amber-950 shadow-card';
      badge.innerHTML = '<i data-lucide="crown" class="w-3 h-3"></i> Most Recommended';
      bestSlot.appendChild(badge);
      fillCard(bestNode, best, fullQuery, true);
      bestSlot.appendChild(bestNode);
      block.appendChild(bestSlot);

      // Alternatives
      const altSlot = document.createElement('div');
      altSlot.className = 'grid sm:grid-cols-2 lg:grid-cols-3 gap-5 mt-6';
      alts.forEach(tool => {
        const node = document.getElementById('recCardTemplate').content.cloneNode(true);
        node.querySelector('.rec-card').classList.add('rec-alt');
        fillCard(node, tool, fullQuery, false);
        altSlot.appendChild(node);
      });
      block.appendChild(altSlot);

      if (window.lucide) lucide.createIcons();

      if (append) {
        resultsBlocks.appendChild(block);
        // Scroll to new block
        block.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } else {
        resultsBlocks.innerHTML = '';
        resultsBlocks.appendChild(block);
      }

      // Show up arrow if more than 1 block
      upArrowBtn.style.opacity = resultsBlocks.children.length > 1 ? '1' : '0';
      upArrowBtn.style.pointerEvents = resultsBlocks.children.length > 1 ? 'auto' : 'none';
    }

    // Event Listeners
    searchBtn.addEventListener('click', () => {
      const val = searchInput.value.trim();
      if (!val) return;
      activeQueries = [val];
      renderTags();
      performSearch(false);
    });

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') searchBtn.click();
    });

    addBtn.addEventListener('click', () => {
      const val = searchInput.value.trim();
      if (!val) return;
      activeQueries.push(val);
      renderTags();
      searchInput.value = '';
      performSearch(true);
    });

    upArrowBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // Initialize
    renderTags();
    if (activeQueries.length > 0) {
      performSearch(false);
    } else {
      // DEMO DATA — shows 7 example cards (1 main + 6 alt) so the layout is
      // visible before a real backend is wired up. BACKEND TODO: once the
      // Gemini-powered recommendation API exists, delete this whole `else`
      // block — searchTools()/performSearch() should only run for a query
      // the user actually typed, not a hardcoded example.
      activeQueries = ["AI tools for professionals"];
      performSearch(false);
      activeQueries = [];
      renderTags();
    }
  </script>
</body>
</html>
